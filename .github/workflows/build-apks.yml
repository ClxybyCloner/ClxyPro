name: Build APKs

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apks:
    name: Release APKs
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: the changelog step diffs against the
      # previous version tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform and build-tools
        run: |
          # The runner image already ships the SDK, so only the platform and
          # build-tools this project compiles against are added. sdkmanager is
          # located by glob because its cmdline-tools directory is versioned.
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$SDKM" ]; then
            echo "::warning::no sdkmanager on the image, using the SDK as-is"
            exit 0
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APKs
        run: |
          chmod +x gradlew tools/build-apks.sh
          GRADLE=./gradlew ./tools/build-apks.sh

      # The README's verify section points at this file.
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ClxyPro-apks
          path: dist/*.apk
          if-no-files-found: error

      # generate_release_notes only emits the compare link when there
      # are no merged PRs — the update dialog then shows no changes
      # at all. Build the notes from this version's commit subjects.
      - name: Build changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          tags=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')
          prev=$(printf '%s\n' "$tags" | sed -n '2p')
          if [ -n "$prev" ]; then
            log=$(git log "$prev..HEAD" --format='- %s')
            compare="https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
          else
            log=$(git log --format='- %s')
            compare="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          fi
          {
            echo 'body<<EOF'
            echo "$log"
            echo ''
            echo "**Full Changelog**: $compare"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: ${{ steps.changelog.outputs.body }}
          fail_on_unmatched_files: true

      # Pre-release versions (1.5.31-rc1) are test builds: they must never
      # refresh the rolling "latest" release, which the in-app updater reads.
      - name: Check pre-release version
        id: pre
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # A branch only ever gets this rolling release, so the APKs under Releases
      # follow main instead of waiting for the next version tag. Version tags
      # above stay the permanent, numbered snapshots.
      - name: Refresh the Latest build release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && steps.pre.outputs.prerelease != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Built from `${{ github.sha }}` on `${{ github.ref_name }}`.
            These APKs are newer than the newest version tag; numbered
            releases are the version tags.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      # overwrite_files only replaces assets with the same name, so an older
      # version's APKs would linger next to the new ones. Drop whatever is not
      # part of this build.
      - name: Drop stale APKs from the Latest build release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && steps.pre.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --json assets --jq '.assets[].name' 2>/dev/null |
          while read -r name; do
            [ -n "$name" ] || continue
            [ -f "dist/$name" ] || gh release delete-asset latest "$name" --yes
          done
